services:
  postgres:
    image: postgres:16-alpine3.23
    container_name: inblack_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - inblack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2-alpine
    container_name: inblack_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-1:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: inblack_api_1
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      INSTANCE_ID: api-1
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    container_name: inblack_api_2
    environment:
      APP_ENV: ${APP_ENV}
      PORT: ${PORT}
      INSTANCE_ID: api-2
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: inblack_proxy
    restart: unless-stopped
    ports:
      - "${PROXY_PORT:-8080}:8080"
    depends_on:
      - api-1
      - api-2

  mailpit:
    image: axllent/mailpit:latest
    container_name: inblack_mailpit
    ports:
      - "${MAILPIT_WEB_PORT:-8025}:8025"   # Web UI เปิดดู OTP และใบเสร็จ
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP สำหรับ Backend ยิงอีเมลเข้า
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  inblack_pgdata: