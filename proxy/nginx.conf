events {
    worker_connections 1024;
}

http {
    # ใช้ Docker internal DNS และให้ refresh IP ทุก 5 วินาที
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backend_api {
        server api-1:8080 max_fails=3 fail_timeout=5s;
        server api-2:8080 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 8080;
        
        location ~ ^/api/v1/orders/[^/]+/events$ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 24h;
        }

        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Health & Metrics Probes
        location ~ ^/(healthz|readyz|metrics)$ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            # ใช้ตัวแปรบังคับให้ Nginx เช็ก IP ของ container 'web' ใหม่เสมอเมื่อ restart
            set $frontend_upstream http://web:3000;
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}